<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive List Preview — shadcn & Hyperiux Vault</title>
  <!-- Tailwind CSS CDN with dark mode config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: "#09090b",
            card: "#18181b",
            border: "#27272a"
          }
        }
      }
    }
  </script>
  <!-- Google Fonts: Inter and JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- GSAP Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- React 18 & Babel for Live In-Browser Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #09090b; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col justify-between">
  <!-- Top Navigation Bar -->
  <header class="border-b border-zinc-800/80 bg-zinc-900/40 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="./" class="text-sm font-semibold tracking-wider text-zinc-400 hover:text-white transition-colors flex items-center gap-2">
        <span>←</span> <span>Back to RAKA Platform</span>
      </a>
      <span class="text-zinc-600">|</span>
      <span class="text-xs uppercase px-2 py-0.5 rounded bg-violet-500/10 text-violet-400 border border-violet-500/20 font-mono">
        shadcn / components / ui
      </span>
    </div>
    <div class="flex items-center gap-4 text-xs text-zinc-400">
      <a href="https://github.com/ayushchandrasahu/RAKA" target="_blank" class="hover:text-white transition-colors font-mono">
        GitHub Repository ↗
      </a>
    </div>
  </header>

  <!-- Main Showcase Container -->
  <main class="flex-1 flex flex-col justify-center items-center px-4 md:px-10 py-16">
    <div id="root" class="w-full max-w-5xl"></div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-zinc-900 px-6 py-4 text-center text-xs text-zinc-500 font-mono">
    Integrated for shadcn / Tailwind CSS / TypeScript • Component: components/ui/interactive-list-preview.tsx
  </footer>

  <!-- Live React Component Script -->
  <script type="text/babel">
    const { useEffect, useRef, useState } = React;

    const DEFAULT_ITEMS = [
      {
        client: "AURORA UI",
        platform: "NEXT.JS",
        services: "Motion Design, GSAP, Page Transitions, UI Systems",
        img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop"
      },
      {
        client: "NEON FLOW",
        platform: "REACT",
        services: "Interactive UI, Scroll Animations, Effects Library",
        img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1000&auto=format&fit=crop"
      },
      {
        client: "GLASSMORPH",
        platform: "NEXT.JS",
        services: "Glass UI, Components, Motion Architecture",
        img: "https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?q=80&w=1000&auto=format&fit=crop"
      },
      {
        client: "VOID SYSTEM",
        platform: "CUSTOM WEBGL",
        services: "Shaders, Creative Development, Visual Effects",
        img: "https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1000&auto=format&fit=crop"
      }
    ];

    function InteractiveListPreview({
      items = DEFAULT_ITEMS,
      imageSize = 1,
      duration = 0.6,
      smoothness = 0.35,
      lerp = 0.18,
      bgColor = "transparent",
      className = ""
    }) {
      const containerRef = useRef(null);
      const previewRef = useRef(null);
      const [activeItem, setActiveItem] = useState(null);
      const [isHovered, setIsHovered] = useState(false);

      const mousePos = useRef({ x: 0, y: 0 });
      const previewPos = useRef({ x: 0, y: 0 });

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!containerRef.current) return;
          const rect = containerRef.current.getBoundingClientRect();
          mousePos.current = {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
          };
        };

        const container = containerRef.current;
        if (container) {
          container.addEventListener("mousemove", handleMouseMove);
        }

        let animationFrameId;
        const updatePreview = () => {
          if (previewRef.current) {
            previewPos.current.x += (mousePos.current.x - previewPos.current.x) * lerp;
            previewPos.current.y += (mousePos.current.y - previewPos.current.y) * lerp;

            gsap.set(previewRef.current, {
              x: previewPos.current.x,
              y: previewPos.current.y,
              xPercent: -50,
              yPercent: -50
            });
          }
          animationFrameId = requestAnimationFrame(updatePreview);
        };

        updatePreview();

        return () => {
          if (container) {
            container.removeEventListener("mousemove", handleMouseMove);
          }
          cancelAnimationFrame(animationFrameId);
        };
      }, [lerp]);

      useEffect(() => {
        if (!previewRef.current) return;

        if (isHovered && activeItem) {
          gsap.to(previewRef.current, {
            opacity: 1,
            scale: imageSize,
            duration: duration,
            ease: "power3.out"
          });
        } else {
          gsap.to(previewRef.current, {
            opacity: 0,
            scale: imageSize * 0.8,
            duration: duration * 0.7,
            ease: "power3.in"
          });
        }
      }, [isHovered, activeItem, imageSize, duration]);

      return (
        <div
          ref={containerRef}
          onMouseLeave={() => setIsHovered(false)}
          className={`relative w-full overflow-hidden select-none ${className}`}
          style={{ backgroundColor: bgColor }}
        >
          {/* Floating Preview Image */}
          <div
            ref={previewRef}
            className="pointer-events-none absolute left-0 top-0 hidden md:block rounded-xl overflow-hidden shadow-2xl border border-white/20 transition-opacity"
            style={{
              width: `${320 * imageSize}px`,
              height: `${210 * imageSize}px`,
              zIndex: 30,
              opacity: 0,
              transform: "translate(-50%, -50%)"
            }}
          >
            {activeItem && (
              <img
                src={activeItem.img}
                alt={activeItem.client}
                className="w-full h-full object-cover"
              />
            )}
          </div>

          {/* List items */}
          <div className="flex flex-col divide-y divide-zinc-800">
            {items.map((item, index) => {
              const isCurrent = activeItem?.client === item.client && isHovered;
              return (
                <div
                  key={index}
                  onMouseEnter={() => {
                    setActiveItem(item);
                    setIsHovered(true);
                  }}
                  className="group relative flex flex-col md:flex-row md:items-center justify-between py-6 px-4 md:px-8 cursor-pointer transition-colors"
                  style={{
                    transitionDuration: `${smoothness}s`
                  }}
                >
                  {/* Highlight bar */}
                  <div
                    className="absolute inset-0 bg-white/[0.04] opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"
                    style={{ transitionDuration: `${smoothness}s` }}
                  />

                  <div className="flex items-center gap-5 z-10">
                    <span className="text-xs font-mono text-zinc-500 group-hover:text-zinc-300">
                      {String(index + 1).padStart(2, "0")}
                    </span>
                    <h3
                      className={`text-2xl md:text-3xl font-extrabold tracking-tight transition-all duration-300 ${
                        isCurrent ? "text-white translate-x-2" : "text-zinc-300 group-hover:text-white"
                      }`}
                    >
                      {item.client}
                    </h3>
                    {item.platform && (
                      <span className="text-[11px] px-2 py-0.5 rounded border border-zinc-700 bg-zinc-800/50 text-zinc-400 font-mono tracking-wider">
                        {item.platform}
                      </span>
                    )}
                  </div>

                  <div className="mt-2 md:mt-0 text-sm text-zinc-400 group-hover:text-zinc-200 z-10 transition-colors">
                    {item.services}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function App() {
      return (
        <div className="space-y-8">
          <div className="space-y-2 border-b border-zinc-800 pb-6">
            <span className="text-xs uppercase tracking-widest text-violet-400 font-mono">
              Hyperiux Vault • shadcn / ui Primitive
            </span>
            <h1 className="text-3xl md:text-5xl font-extrabold tracking-tight text-white">
              Interactive List Preview
            </h1>
            <p className="text-zinc-400 text-sm md:text-base">
              Hover over the list rows below on desktop to trigger the smooth GSAP cursor-following image reveal.
            </p>
          </div>

          <div className="rounded-2xl border border-zinc-800/80 bg-zinc-900/30 backdrop-blur overflow-hidden p-2 md:p-6 shadow-2xl">
            <InteractiveListPreview />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
